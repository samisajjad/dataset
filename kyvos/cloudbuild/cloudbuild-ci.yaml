# CI pipeline: validates exported Kyvos objects on every push.
# Trigger this on branches: dev, qa, prod (one trigger per branch, see kyvos/README.md).
steps:
  - id: validate-exports
    name: python:3.11-slim
    entrypoint: bash
    args:
      - kyvos/scripts/validate.sh
      - '${_ENV}'

substitutions:
  _ENV: dev

options:
  logging: CLOUD_LOGGING_ONLY
