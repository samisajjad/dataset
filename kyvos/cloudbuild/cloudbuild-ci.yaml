# CI pipeline: validates entity XML files on every push.
# One trigger per branch: dev, qa, prod (see kyvos/README.md).
steps:
  - id: validate-entities
    name: python:3.11-slim
    entrypoint: bash
    args:
      - kyvos/scripts/validate.sh
      - '${_ENV}'

substitutions:
  _ENV: dev

options:
  logging: CLOUD_LOGGING_ONLY
